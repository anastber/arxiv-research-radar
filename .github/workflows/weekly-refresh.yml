name: Weekly paper refresh

# Re-pulls the latest matching arXiv papers, rebuilds the chunks/embeddings/FAISS
# index, and commits data/papers.json + data/index/ if anything changed.
#
# Needs no secrets: ingestion and indexing don't call any LLM, only arXiv and a
# local embedding model. Requires "contents: write" below to push the update.

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday, 06:00 UTC
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "Commit and push the refreshed data (uncheck for a dry run)"
        type: boolean
        default: true

permissions:
  contents: write

# Don't let a manual run race a scheduled one.
concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache embedding model weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ hashFiles('config.py') }}
          restore-keys: |
            hf-cache-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest papers from arXiv
        run: python -m ingest.fetch

      - name: Rebuild chunks, embeddings and the FAISS index
        run: python -m rag.index

      - name: Sanity-check the rebuilt index
        run: |
          python - <<'EOF'
          from rag.retriever import Retriever
          hits = Retriever().search("retrieval augmented generation", k=3)
          assert hits, "rebuilt index returned zero results for a smoke-test query"
          print(f"OK: {len(hits)} sample hits, top score {hits[0]['score']:.2f}")
          EOF

      - name: Show what changed
        run: git status --short data/

      - name: Commit and push the refreshed data
        if: github.event_name != 'workflow_dispatch' || inputs.commit_changes == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json data/index/faiss.index data/index/chunks.json
          if git diff --cached --quiet; then
            echo "No changes to commit (same papers as last run)."
            exit 0
          fi
          paper_count=$(python - <<'EOF'
          import json
          print(len(json.load(open("data/papers.json"))))
          EOF
          )
          git commit -m "chore: weekly refresh - ${paper_count} papers ($(date -u +%Y-%m-%d))"
          git push origin HEAD:"${{ github.ref_name }}"
